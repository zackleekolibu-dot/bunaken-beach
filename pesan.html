    <main>
      <section id="pesan">
        <h2>Pesan Kunjungan</h2>
        <form action="#" method="post">
          <fieldset>
            <legend>Data Pengunjung</legend>

            <label for="nama">Nama</label>
            <input type="text" id="nama" name="nama" required />

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />

            <label for="tgl">Tanggal Kunjungan</label>
            <input type="date" id="tgl" name="tgl" />

            <label for="jml">Jumlah Orang</label>
            <input type="number" id="jml" name="jml" min="1" max="20" />

            <label for="paket">Paket</label>
            <select id="paket" name="paket">
              <option>Snorkeling</option>
              <option>Diving</option>
              <option>Island Tour</option>
            </select>

            <label for="catatan">Catatan</label>
            <textarea id="catatan" name="catatan" rows="3"></textarea>

            <button type="submit">Kirim Pesanan</button>
          </fieldset>
        </form>
      </section>
    </main>
